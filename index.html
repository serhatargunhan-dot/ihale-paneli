<html lang="tr">
<head>

<style>
:root{--bg:#F4F2EE;--card:#FFFFFF;--ink:#1C1D21;--muted:#6B6A66;--line:#E2DED6;--accent:#1F2A44;--gold:#B08A3E;--green:#E6F2E4;--greenInk:#2F6B33;--red:#B3261E;--redBg:#FBE9E7;--amber:#8A5A00;--amberBg:#FFF4DC;--input:#FFFDF5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--card:#1D1F24;--ink:#ECEAE5;--muted:#A19E97;--line:#33363D;--accent:#AFC3F0;--gold:#D9B66A;--green:#1F3322;--greenInk:#9FD3A3;--red:#F2B8B5;--redBg:#3A1F1E;--amber:#F0C46A;--amberBg:#3A2E14;--input:#23252B}}
:root[data-theme="dark"]{--bg:#141518;--card:#1D1F24;--ink:#ECEAE5;--muted:#A19E97;--line:#33363D;--accent:#AFC3F0;--gold:#D9B66A;--green:#1F3322;--greenInk:#9FD3A3;--red:#F2B8B5;--redBg:#3A1F1E;--amber:#F0C46A;--amberBg:#3A2E14;--input:#23252B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.sp{flex:1}
a.btn{text-decoration:none;display:inline-block}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:600}
button.small{padding:4px 9px;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=search]{min-width:220px}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.card:hover{border-color:var(--muted)}
.due{font-weight:700;font-size:15px}
.due small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.due.hot{color:var(--red)}
.inst{font-weight:600}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.b.our{background:var(--green);color:var(--greenInk);border-color:transparent;font-weight:600}
.b.st-takip{background:var(--amberBg);color:var(--amber);border-color:transparent}
.b.st-verildi{background:var(--green);color:var(--greenInk);border-color:transparent}
.b.st-gizli{opacity:.6}
.b.open{border-color:var(--accent);color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.note{background:var(--amberBg);color:var(--amber);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.back{margin-bottom:10px}
.dhead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dhead h2{margin:0 0 4px;font-size:19px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv b{color:var(--muted);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sel td{background:color-mix(in srgb,var(--green) 55%,transparent)}
td.num{text-align:right;white-space:nowrap}
.oneri.our{color:var(--greenInk);font-weight:600}
.kr{color:var(--muted);font-size:12px;margin-top:3px}
.kr details summary{cursor:pointer;color:var(--accent)}
td input[type=text]{width:150px}
td input[type=number]{width:96px;text-align:right}
.foot{display:grid;grid-template-columns:1fr 320px;gap:12px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.box label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.box input,.box select,.box textarea{width:100%}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.tot .g{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.saved{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:10}
.mbody{background:var(--card);border-radius:12px;padding:14px;max-width:860px;width:100%}
.mbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.paperwrap{overflow:auto;background:#d9d6cf;padding:10px;border-radius:8px}
/* teklif kağıdı: her zaman açık renk */
.paper{width:794px;background:#fff;color:#111;padding:38px 40px;margin:0 auto;font:11px/1.35 Arial,Helvetica,sans-serif}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start}
.paper .ttl{font-size:19px;font-weight:700;color:#111}
.paper table{font-size:10.5px;color:#111}
.paper .mt td{border:1px solid #b9bcc4;padding:3px 6px}
.paper .it th{background:#1F2A44;color:#fff;border:1px solid #1F2A44;padding:6px 4px;text-align:center;position:static;font-size:10px}
.paper .it td{border:1px solid #b9bcc4;padding:4px 5px}
.paper .band{background:#1F2A44;color:#fff;font-weight:700;padding:3px 6px;margin-top:10px}
.paper .gt{background:#1F2A44;color:#fff;font-weight:700;font-size:13px}
.paper .r{text-align:right}.paper .c{text-align:center}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.card{grid-template-columns:1fr}.badges{justify-content:flex-start}.foot{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.set{grid-template-columns:1fr}input[type=search]{min-width:0;width:100%}}
@media (max-width:760px){.tblwrap table,.tblwrap tbody,.tblwrap tr,.tblwrap td{display:block;width:100%}.tblwrap thead{display:none}.tblwrap tr{border-bottom:1px solid var(--line);padding:8px 4px}.tblwrap td{border:none;padding:3px 10px;text-align:left!important}.tblwrap td::before{content:attr(data-l);display:block;color:var(--muted);font-size:11px}.tblwrap td input[type=text],.tblwrap td input[type=number]{width:100%}}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12.5px}
.tile.hot b{color:var(--red)}
.sec{font-size:15px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec a{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}
.b.new{background:var(--red);color:#fff;border-color:transparent;font-weight:700}
.krow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
.krow:hover{border-color:var(--muted)}
.krow .q{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.filters2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.filters2 select{padding:6px 8px}
a.lnk{color:var(--accent);text-decoration:none;font-weight:600}
@media (max-width:760px){
 .wrap{padding:12px 12px calc(76px + env(safe-area-inset-bottom))}
 .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
 .tab{border:0;background:none;color:var(--muted);padding:6px 8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
 .tab.on{background:none;color:var(--accent)}
 .tab i{font-style:normal;font-size:19px;line-height:1}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 input[type=search]{min-width:0;width:100%}
 h1{font-size:19px}
}
@media (min-width:761px){.tab i{display:none}}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.login h1{display:flex;align-items:center;gap:10px}.login img{width:40px;height:40px;border-radius:10px}
.login input{width:100%}.err{color:var(--red);font-weight:600;font-size:13px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.u{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:700;display:inline-block;margin-top:4px}
.u-ok{background:var(--green);color:var(--greenInk)}.u-kis{background:var(--amberBg);color:var(--amber)}.u-no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.u-bel{background:var(--line);color:var(--muted)}
.isr{font-weight:600}.gv{font-size:11px;color:var(--muted);font-weight:500}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sbox h3{margin:0 0 6px;font-size:15px}.flist{display:flex;flex-direction:column;gap:6px;margin:6px 0}.frow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:9px}.fic{font-size:10px;font-weight:800;background:#b3261e;color:#fff;border-radius:5px;padding:3px 5px;min-width:30px;text-align:center}.fad{flex:1;word-break:break-word}.fad small{color:var(--muted)}.frow a[aria-disabled]{opacity:.5;pointer-events:none}.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--accent);width:0}
</style>
</head>

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n=>(Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});

function firma(k){const o=(S.ayar&&S.ayar[k])||{};return Object.assign({},FIRMA_VARS[k],o);}
function dueInfo(iso){const d=new Date(iso);const ms=d-Date.now();const days=Math.floor(ms/864e5);const t=d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});let rel;if(ms<0)rel='süresi doldu';else if(ms<36e5*24)rel=Math.max(1,Math.round(ms/36e5))+' saat kaldı';else rel=days+' gün kaldı';return{t,rel,hot:ms<36e5*30,past:ms<0};}
function st(id){return (S.teklif[id]&&S.teklif[id].durum)||'yeni';}
const STL={yeni:'Yeni',takip:'Takipte',verildi:'Teklif verildi',gizli:'Gizli'};

// ---------- yazı ile ----------
function yazi(n){n=Math.round(n*100)/100;const tl=Math.floor(n),kr=Math.round((n-tl)*100);const b=['','BİR','İKİ','ÜÇ','DÖRT','BEŞ','ALTI','YEDİ','SEKİZ','DOKUZ'],o=['','ON','YİRMİ','OTUZ','KIRK','ELLİ','ALTMIŞ','YETMİŞ','SEKSEN','DOKSAN'];const uc=x=>{const y=Math.floor(x/100),on=Math.floor(x%100/10),bi=x%10;return[(y?(y>1?b[y]:'')+'YÜZ':''),o[on],b[bi]].filter(Boolean).join(' ');};const g=[['',1],['BİN',1e3],['MİLYON',1e6],['MİLYAR',1e9]];let s='',r=tl;for(let i=g.length-1;i>=0;i--){const v=Math.floor(r/g[i][1]);r%=g[i][1];if(!v)continue;if(i===1&&v===1)s+='BİN ';else s+=uc(v)+(g[i][0]?' '+g[i][0]:'')+' ';}s=(s.trim()||'SIFIR')+' TL';if(kr)s+=' '+uc(kr)+' KURUŞ';return s;}

function ilOf(x){if(x.il)return x.il;const m=(x.kurum||'').match(/^([A-ZÇĞİÖŞÜ][a-zçğıöşü]+)/);return m?m[1]:'';}
function active(x){return st(x.id)!=='gizli'&&new Date(x.son)>=Date.now();}
function allL(){return Object.entries(S.ihaleler).map(([id,d])=>({id,...d}));}
function loadSeen(){try{S.seen=JSON.parse(localStorage.getItem('ip_seen')||'null');}catch(e){S.seen=null;}}
function isNew(id){return S.seen&&!S.seen.includes(id);}
function markSeen(){try{localStorage.setItem('ip_seen',JSON.stringify(Object.keys(S.ihaleler)));}catch(e){}}
const isBap=x=>/bilimap/i.test(x.kaynak||'');
const isDT=x=>/do[ğg]rudan/i.test(x.usul||'');
const grp=x=>isBap(x)?'bap':isDT(x)?'dt':'ihale';
const GRPS=['dt','ihale','bap'];
function newCount(g){return allL().filter(x=>active(x)&&isNew(x.id)&&grp(x)===g).length;}
function shell(inner,tab){
  const T=[['home','⌂','Bugün'],['dt','☰','Doğrudan Temin'],['ihale','⚖','İhaleler'],['bap','🎓','BAP (Bilimap)'],['kalem','⌕','Kalem ara']];
  const srcs=[...new Set(allL().filter(active).map(x=>x.kaynak).join(' + ').split(' + ').filter(Boolean))].join(' · ')||'İhale Dünyası · Bilimap';
  $('#app').innerHTML=`<header><div><h1>İhale Paneli</h1><div class="sub">${esc(srcs)}</div></div><span class="sp"></span><div class="hbtns"><button class="small" id="instBtn" hidden>Uygulamayı yükle</button><button class="small" id="refBtn" title="Yenile">⟳</button><button class="small" id="ayarBtn">Firma bilgileri</button><button class="small" id="outBtn">Çıkış</button></div></header>
  ${S.stale?'<div class="note">Veriye şu an ulaşılamıyor; gösterilenler güncel olmayabilir.</div>':''}
  <nav class="tabs">${T.map(([k,i,l])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}"><i>${i}</i>${l}${GRPS.includes(k)&&newCount(k)?`<span class="n">${newCount(k)}</span>`:''}</button>`).join('')}</nav>${inner}`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.view=b.dataset.tab;rerender(true);window.scrollTo(0,0);});
  $('#ayarBtn').onclick=renderAyar;$('#refBtn').onclick=()=>loadAll(true);$('#outBtn').onclick=async()=>{await SB.auth.signOut();location.reload();};
  const ib=$('#instBtn');if(ib&&window.__inst){ib.hidden=false;ib.onclick=async()=>{window.__inst.prompt();await window.__inst.userChoice;window.__inst=null;ib.hidden=true;};}
  document.querySelectorAll('.card,[data-open]').forEach(c=>c.onclick=()=>openDetail(c.dataset.id||c.dataset.open));}
function renderHome(){
  const A=allL().filter(active),now=Date.now();
  const in24=A.filter(x=>new Date(x.son)-now<864e5),in3=A.filter(x=>new Date(x.son)-now<3*864e5);
  const urgent=in3.filter(x=>st(x.id)!=='verildi').sort((a,b)=>a.son.localeCompare(b.son)).slice(0,8);
  const top=A.filter(x=>!x.sartVar&&!x.sartOkundu&&st(x.id)!=='verildi').sort((a,b)=>a.son.localeCompare(b.son)).slice(0,6);
  const nw=A.filter(x=>isNew(x.id)).sort((a,b)=>a.son.localeCompare(b.son));
  const tile=(n,l,f,hot)=>`<div class="tile ${hot&&n?'hot':''}" data-go="${f}"><b>${n}</b><span>${l}</span></div>`;
  shell(`<div class="tiles">${tile(in24.length,'24 saat içinde son teklif','aktif',1)}${tile(nw.length,'Yeni eklenen ilan','yeni',1)}${tile(A.filter(x=>st(x.id)==='takip').length,'Takipte','takip')}${tile(A.filter(x=>st(x.id)==='verildi').length,'Teklif verildi','verildi')}</div>
  ${nw.length?`<div class="sec">Yeni eklenenler <a data-go="yeni">Tümü →</a></div><div class="list">${nw.slice(0,5).map(card).join('')}</div>`:''}
  <div class="sec">Son teklifi yaklaşanlar (3 gün) <a data-go="aktif">Tüm ihaleler →</a></div><div class="list">${urgent.length?urgent.map(card).join(''):'<div class="empty">3 gün içinde son teklifi olan ihale yok.</div>'}</div>
  <div class="sec">Şartname dosyası henüz eklenmeyenler</div><div class="list">${top.map(card).join('')||'<div class="empty">Aktif ilanların hepsinin şartnamesi eklendi.</div>'}</div>`,'home');
  document.querySelectorAll('[data-go]').forEach(t=>t.onclick=()=>{const f=t.dataset.go;S.filter=f==='yeni'?'yeni':f;const A2=allL().filter(x=>f==='yeni'?active(x)&&isNew(x.id):f==='aktif'?active(x):st(x.id)===f);S.view=GRPS.map(g=>[g,A2.filter(x=>grp(x)===g).length]).sort((a,b)=>b[1]-a[1])[0][0];S.q='';rerender(true);window.scrollTo(0,0);});}
function renderKalem(){
  const q=S.kq.trim().toLocaleLowerCase('tr');let R=[];
  if(q.length>=2){allL().filter(active).forEach(x=>(x.kalemler||[]).forEach(k=>{if((k.ad+' '+(k.an?(k.an.tarif||'')+' '+((k.an.isaret||{}).marka||'')+' '+((k.an.isaret||{}).urun||''):'')).toLocaleLowerCase('tr').includes(q))R.push({x,k});}));R.sort((a,b)=>a.x.son.localeCompare(b.x.son));}
  const tot={};R.forEach(r=>{const b=(r.k.birim||'').toLocaleLowerCase('tr');if(typeof r.k.miktar==='number')tot[b]=(tot[b]||0)+r.k.miktar;});
  shell(`<div class="tools"><input type="search" id="kq" placeholder="Kalem ara: davye, portegü, frez, gutta…" value="${esc(S.kq)}"></div>

  <div class="list">${R.slice(0,300).map(({x,k})=>{const d=dueInfo(x.son);return `<div class="krow" data-open="${x.id}"><div><b>${esc(k.ad)}</b>${k.an&&k.an.isaret&&k.an.isaret.marka?' <span class="b">'+esc(k.an.isaret.marka+' '+(k.an.isaret.urun||''))+'</span>':''}<div class="meta">${esc(x.kurum)} · <span class="${d.hot?'due hot':''}" style="font-size:12.5px">${d.t} · ${d.rel}</span></div></div><div class="q">${fmtQ(k.miktar)} ${esc(k.birim)}</div></div>`;}).join('')}</div>`,'kalem');

const safeName=s=>(s.replace(/[çÇğĞıİöÖşŞüÜ]/g,c=>TRM[c]).replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(-120))||'dosya';
async function fileLinks(id){const F=S.dosya[id]||[];if(!F.length)return;const {data}=await SB.storage.from('sartname').createSignedUrls(F.map(f=>f.path),3600);

async function dosyaYukle(id,files){const msg=t=>{if($('#smsg'))$('#smsg').textContent=t;};const list=[];
  async function one(name,blob){if(/\.zip$/i.test(name)){const z=await JSZip.loadAsync(await blob.arrayBuffer());for(const e of Object.values(z.files)){if(e.dir||/__MACOSX|\/\./.test(e.name))continue;await one(e.name.split('/').pop(),new Blob([await e.async('uint8array')]));}}else list.push({name,blob});}
  try{for(const f of files){msg('Açılıyor: '+f.name);await one(f.name,f);}
    let n=0;for(const {name,blob} of list){msg(`Yükleniyor ${++n}/${list.length}: ${name}`);const path=safeName(id)+'/'+safeName(name);
      const ct=/\.pdf$/i.test(name)?'application/pdf':'application/octet-stream';

function applyAnaliz(){const o={};for(const [id,x] of Object.entries(S.raw)){const a=S.analiz[id];const ak=(a&&a.kalemler)||{};

const UY={'uygun':['u-ok','✓ Uygun'],'kısmen':['u-kis','⚠ Kısmen uygun'],'uygun değil':['u-no','✗ Uygun değil'],'belirsiz':['u-bel','? Belirsiz']};

async function fileB64(f){const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function collectDocs(files,msg){const pdfs=[],texts=[],skip=[];
  async function one(name,blob){const n=name.toLowerCase();
    if(n.endsWith('.pdf'))pdfs.push({name,data:await fileB64(blob)});
    else if(n.endsWith('.docx')){const r=await mammoth.extractRawText({arrayBuffer:await blob.arrayBuffer()});texts.push({name,text:r.value});}
    else if(n.endsWith('.txt')||n.endsWith('.html')||n.endsWith('.htm'))texts.push({name,text:(await blob.text()).replace(/<[^>]+>/g,' ')});
    else if(n.endsWith('.zip')){const z=await JSZip.loadAsync(await blob.arrayBuffer());for(const e of Object.values(z.files)){if(e.dir)continue;await one(e.name.split('/').pop(),new Blob([await e.async('uint8array')]));}}
    else skip.push(name);}
  for(const f of files){msg('Açılıyor: '+f.name);await one(f.name,f);}
  return {pdfs,texts,skip};}
async function runAnaliz(id,files,fresh){const box=$('#smsg'),bar=$('#sbar');const msg=t=>{if($('#smsg'))$('#smsg').textContent=t;};
  try{const docs=await collectDocs(files,msg);
    if(!docs.pdfs.length&&!docs.texts.length){msg('Okunabilir dosya bulunamadı (PDF, Word .docx veya ZIP yükleyin). Atlananlar: '+docs.skip.join(', '));return;}
    const mb=docs.pdfs.reduce((a,p)=>a+p.data.length*0.75,0)/1048576;if(mb>28){msg('PDF dosyaları çok büyük ('+mb.toFixed(0)+' MB). Sadece teknik şartname dosyasını yükleyin.');return;}
    const x=S.raw[id],K=x.kalemler||[];const prev=(!fresh&&S.analiz[id])||{};
    const a={durum:'okundu',dosyalar:[...docs.pdfs.map(p=>p.name),...docs.texts.map(t=>t.name)],atlanan:docs.skip,tarih:new Date().toISOString(),genel:prev.genel||null,kalemler:{...(prev.kalemler||{})}};
    const todo=K.map((k,i)=>i).filter(i=>!a.kalemler[String(K[i].n)]);const B=8;
    for(let j=0;j<todo.length;j+=B){const from=todo[j],to=todo[Math.min(j+B,todo.length)-1]+1;
      msg(`İnceleniyor: kalem ${j+1}–${Math.min(j+B,todo.length)} / ${todo.length} (her parça 1-2 dakika sürebilir)`);if($('#sbar'))$('#sbar').style.width=(j/todo.length*100)+'%';
      const {data,error}=await SB.functions.invoke('sartname-analiz',{body:{id,from,to,pdfs:docs.pdfs,texts:docs.texts,genel:!a.genel}});
      if(error){let m=error.message;try{m=(await error.context.json()).error||m;}catch(e){}msg('Hata: '+m+' — "İncele" ile kaldığı yerden devam edebilirsiniz.');break;}
      if(data.genel&&data.genel.ozet)a.genel=data.genel;(data.kalemler||[]).forEach(r=>a.kalemler[String(r.n)]=r);
      S.analiz[id]=a;await SB.from('ihale_analiz').upsert({id,data:a,updated_at:new Date().toISOString()});applyAnaliz();}
    if(Object.keys(a.kalemler).length>=K.length){msg('Şartname incelendi.');}
    renderDetail();}catch(e){msg('Hata: '+(e&&e.message||e));}}

async function flush(id){if(!S.db){const el=$('#saved');if(el)el.textContent='Kayıt şu an yapılamıyor (oturum kapalı olabilir).';return;}if(busy[id]){pend[id]=setTimeout(()=>flush(id),400);return;}busy[id]=true;try{await S.db.doc('teklifler/'+id).set(JSON.parse(JSON.stringify(S.teklif[id])));const el=$('#saved');if(el)el.textContent='Kaydedildi';}catch(e){const el=$('#saved');if(el)el.textContent=e&&e.code==='invalid_argument'?'Bu sayfada değişiklik yetkiniz yok.':'Kaydedilemedi, tekrar deneyin.';}finally{busy[id]=false;}}

// ---------- teklif formu ----------
function paperHTML(id){const x=S.ihaleler[id],t=tk(id),f=firma(t.firma),c=calc(id);const today=new Date().toLocaleDateString('tr-TR');const logo=f.logo==='arg'?LOGO_ARG:LOGO_KR;
  const rows=c.L.map((l,i)=>`<tr><td class="c">${i+1}</td><td>${esc(l.k.ad)}</td><td>${esc(l.r.marka||'')}</td><td class="c">${fmtQ(l.k.miktar)}</td><td class="c">${esc(l.k.birim)}</td><td class="r">${fmt(l.r.fiyat)}</td><td class="c">${Number(l.r.kdv??10)}</td><td class="r">${fmt(l.tut)}</td></tr>`).join('');
  const kdvRows=[1,10,20].map(p=>`<tr><td class="r" style="border:none"><b>KDV %${p}</b></td><td class="r">${fmt(c.kdv[p]||0)}</td></tr>`).join('');
  return `<div class="paper" id="paper"><div class="ph"><img src="${logo}" style="height:${f.logo==='arg'?54:80}px"><div style="text-align:right"><div class="ttl">FİYAT TEKLİF FORMU</div><table style="margin-left:auto;margin-top:14px" class="mt"><tr><td><b>Tarih</b></td><td style="min-width:110px" class="r">${today}</td></tr><tr><td><b>Geçerlilik</b></td><td class="r">${esc(t.gecerlilik)}</td></tr><tr><td><b>Para Birimi</b></td><td class="r">TL</td></tr></table></div></div>
  <div style="margin-top:10px;font-weight:700;font-size:11.5px">${esc(f.ad)}</div><div>${esc(f.adres)}</div>${f.vergi?`<div>${esc(f.vergi)}</div>`:''}<div style="border-bottom:2px solid #111;padding-bottom:3px"><b>Tel / E-posta:</b> ${esc(f.tel||'')}</div>
  <div class="band">TEKLİF VERİLEN İDARE / KURUM</div><table class="mt" style="width:100%"><tr><td style="width:34%"><b>İdare / Kurum Adı</b></td><td>${esc(x.kurum)}</td></tr><tr><td><b>İşin Adı / Konusu</b></td><td>${esc(x.is)}</td></tr><tr><td><b>İhale Kayıt No / Dosya No</b></td><td>${esc(x.dtno)}</td></tr><tr><td><b>Yetkili / Telefon</b></td><td>${esc((x.iletisim||'').replace(/([a-z0-9])(Adres|Tel|Telefon|Faks)\b/g,'$1 • $2'))}</td></tr></table>
  <p style="font-style:italic;margin:10px 0 6px">İdarenizce talep edilen ve aşağıda cinsi, miktarı ve özellikleri belirtilen malzemelere ait fiyat teklifimiz aşağıda sunulmuştur.</p>
  <table class="it" style="width:100%"><thead><tr><th style="width:5%">Sıra No</th><th>Malzemenin Adı / Açıklaması</th><th style="width:17%">Marka / Model</th><th style="width:8%">Miktar</th><th style="width:7%">Birim</th><th style="width:11%">Birim Fiyat (KDV Hariç)</th><th style="width:6%">KDV %</th><th style="width:12%">Tutar (TL)</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="c">Kalem seçilmedi</td></tr>'}</tbody></table>
  <div style="display:flex;gap:16px;margin-top:10px"><table class="mt" style="flex:1;align-self:flex-start"><tr><td style="width:30%"><b>Teslim Süresi</b></td><td>${esc(t.teslim)}</td></tr><tr><td><b>Teslim Yeri</b></td><td>${esc(t.teslimYeri)}</td></tr><tr><td><b>Ödeme</b></td><td>${esc(t.odeme)}</td></tr><tr><td><b>Açıklama</b></td><td>${esc(t.aciklama)}</td></tr></table>
  <table class="mt" style="width:250px"><tr><td class="r" style="border:none"><b>TOPLAM (KDV Hariç) (TL)</b></td><td class="r" style="width:95px"><b>${fmt(c.net)}</b></td></tr>${kdvRows}<tr><td class="gt r">GENEL TOPLAM (TL)</td><td class="gt r">${fmt(c.genel)}</td></tr></table></div>
  <table class="mt" style="width:100%;margin-top:10px"><tr><td style="width:12%"><b>Yazı ile:</b></td><td>${yazi(c.genel)}</td></tr></table>
  <p style="margin-top:12px">Yukarıda cinsi, miktarı ve özellikleri belirtilen malzemeleri, şartname ve idarece belirlenen koşullara uygun olarak, KDV hariç toplam ${fmt(c.net)} TL bedel karşılığında teslim etmeyi kabul ve taahhüt ederiz.</p>
  <div style="display:flex;justify-content:space-between;margin-top:18px"><div><b>Teklif Veren</b><div style="margin-top:8px">${esc(f.kisa)}</div><div style="margin-top:6px"><b>Yetkili:</b> ${esc(f.yetkili||'')}</div></div><div style="text-align:center;width:260px"><b>Kaşe / İmza</b>${f.kase?`<div><img src="${KASE_ARG}" style="width:230px;margin-top:4px"></div>`:'<div style="height:90px"></div>'}</div></div></div>`;}
function preview(id){const c=calc(id);if(!c.L.length){alertBox('Önce teklif vereceğiniz kalemleri seçip birim fiyat girin.');return;}
  $('#modal').innerHTML=`<div class="modal"><div class="mbody"><div class="mbar"><b>Teklif formu önizleme</b><span class="sp"></span><span class="saved" id="pmsg"></span><button class="pri" id="dl">PDF oluştur</button><button id="cl">Kapat</button></div><div class="paperwrap">${paperHTML(id)}</div></div></div>`;
  $('#cl').onclick=()=>$('#modal').innerHTML='';
  $('#dl').onclick=async()=>{const msg=$('#pmsg');msg.textContent='PDF hazırlanıyor…';try{const x=S.ihaleler[id];const box=document.createElement('div');box.style.cssText='position:absolute;left:-10000px;top:0;width:794px;background:#fff';box.innerHTML=$('#paper').outerHTML;box.firstElementChild.removeAttribute('id');document.body.appendChild(box);await Promise.all([...box.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));const name=safeName('Teklif_'+(x.kurum||'')).slice(0,60)+'.pdf';const pdf=await html2pdf().set({margin:0,filename:name,image:{type:'png'},html2canvas:{scale:3,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:900},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},pagebreak:{mode:['css','legacy']}}).from(box.firstElementChild).outputPdf('blob');box.remove();const blob=new Blob([pdf],{type:'application/pdf'});if(window.__pdfUrl)URL.revokeObjectURL(window.__pdfUrl);const u=window.__pdfUrl=URL.createObjectURL(blob);
      msg.innerHTML=`PDF hazır (${(blob.size/1048576).toFixed(1)} MB): <a class="btn small" href="${u}" target="_blank" rel="noopener">Aç</a> <a class="btn small" href="${u}" download="${name}">Kaydet</a>`;}catch(e){document.querySelectorAll('body>div[style*="-10000px"]').forEach(e=>e.remove());msg.textContent='PDF oluşturulamadı: '+(e&&e.message||e);}};}
function alertBox(t){$('#modal').innerHTML=`<div class="modal"><div class="mbody" style="max-width:420px"><p>${esc(t)}</p><button id="cl">Tamam</button></div></div>`;$('#cl').onclick=()=>$('#modal').innerHTML='';}

// ---------- firma ayarları ----------
function renderAyar(){const a=firma('argunhan'),k=firma('kristal');const fld=(p,o,f,l)=>`<label>${l}</label><input type="text" data-p="${p}" data-f="${f}" value="${esc(o[f]||'')}">`;
  $('#modal').innerHTML=`<div class="modal"><div class="mbody" style="max-width:720px"><div class="mbar"><b>Firma bilgileri (teklif formunda görünür)</b><span class="sp"></span><span class="saved" id="amsg"></span><button class="pri" id="as">Kaydet</button><button id="cl">Kapat</button></div><div class="set"><div class="box"><b>Argunhan Dental</b>${fld('argunhan',a,'tel','Tel / E-posta')}${fld('argunhan',a,'yetkili','Yetkili')}${fld('argunhan',a,'adres','Adres')}</div><div class="box"><b>Kristal Diş Deposu</b>${fld('kristal',k,'tel','Tel / E-posta')}${fld('kristal',k,'yetkili','Yetkili')}${fld('kristal',k,'vergi','Vergi dairesi / no')}${fld('kristal',k,'adres','Adres')}</div></div></div></div>`;
  $('#cl').onclick=()=>$('#modal').innerHTML='';
  $('#as').onclick=async()=>{const o={argunhan:{},kristal:{}};document.querySelectorAll('[data-p]').forEach(i=>o[i.dataset.p][i.dataset.f]=i.value);S.ayar=o;try{await S.db.doc('ayarlar/firmalar').set(o);$('#amsg').textContent='Kaydedildi';}catch(e){$('#amsg').textContent='Kaydedilemedi';}};}

function rerender(force){if(!force&&$('#modal').innerHTML)return;if(S.view==='home')return renderHome();if(S.view==='kalem'){if(!force&&document.activeElement&&document.activeElement.id==='kq')return;return renderKalem();}if(S.view==='detail'){const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;renderDetail();}else renderList();}
window.addEventListener('pagehide',markSeen);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')markSeen();});

const DB={doc:path=>({set:async o=>{const [c,id]=path.split('/');const now=new Date().toISOString();
  const r=c==='teklifler'?await SB.from('ihale_teklifler').upsert({id,data:o,updated_at:now}):await SB.from('ihale_ayarlar').upsert({key:id,data:o,updated_at:now});
  if(r.error)throw r.error;}})};
function loginView(msg){$('#app').innerHTML=`<form class="login" id="lf"><h1><img src="icons/icon-192.png" alt="">İhale Paneli</h1><div class="sub">Kristal yönetici hesabınızla giriş yapın.</div>
  <input id="le" type="email" autocomplete="email" placeholder="E-posta" required><input id="lp" type="password" autocomplete="current-password" placeholder="Şifre" required>
  ${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="pri">Giriş yap</button><div class="sub">Bu cihazda oturum açık kalır.</div></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)return loginView('E-posta veya şifre hatalı.');boot();};}
async function loadAll(manual){
  const since=new Date(Date.now()-3*864e5).toISOString();
  const [a,an,b,c,dz]=await Promise.all([SB.from('ihale_ilanlar').select('id,data').gte('son',since).limit(5000),SB.from('ihale_analiz').select('id,data').limit(5000),SB.from('ihale_teklifler').select('id,data').limit(5000),SB.from('ihale_ayarlar').select('key,data'),SB.from('ihale_dosyalar').select('path,ilan,ad,boyut').order('ad').limit(10000)]);
  if(a.error){S.stale=true;rerender(true);return;}
  const o={};a.data.forEach(r=>o[r.id]=r.data);S.raw=o;S.dosya={};(dz.data||[]).forEach(r=>(S.dosya[r.ilan]=S.dosya[r.ilan]||[]).push(r));S.analiz={};(an.data||[]).forEach(r=>S.analiz[r.id]=r.data);applyAnaliz();
  (b.data||[]).forEach(r=>{if(!pend[r.id]&&!busy[r.id])S.teklif[r.id]=r.data;});
  const f=(c.data||[]).find(r=>r.key==='firmalar');if(f)S.ayar=f.data;
  if(!S.seen){S.seen=Object.keys(o);markSeen();}
  S.loaded=true;S.stale=false;rerender(manual===true);}
async function boot(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return loginView();
  const {data:me}=await SB.from('profiles').select('is_admin').eq('id',session.user.id).single();
  if(!me||!me.is_admin){await SB.auth.signOut();return loginView('Bu hesabın yönetici yetkisi yok.');}
  S.db=DB;loadSeen();rerender(true);await loadAll();
  SB.channel('ihale').on('postgres_changes',{event:'*',schema:'public',table:'ihale_teklifler'},p=>{const r=p.new;if(r&&r.id&&!pend[r.id]&&!busy[r.id]){S.teklif[r.id]=r.data;rerender();}})
    .on('postgres_changes',{event:'*',schema:'public',table:'ihale_analiz'},p=>{const r=p.new;if(r&&r.id){S.analiz[r.id]=r.data;applyAnaliz();rerender();}})
    .on('postgres_changes',{event:'*',schema:'public',table:'ihale_dosyalar'},()=>{clearTimeout(boot.t);boot.t=setTimeout(loadAll,1500);})
    .on('postgres_changes',{event:'*',schema:'public',table:'ihale_ilanlar'},()=>{clearTimeout(boot.t);boot.t=setTimeout(loadAll,1500);}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll();});
  setInterval(loadAll,5*60*1000);}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__inst=e;const ib=$('#instBtn');if(ib){ib.hidden=false;ib.onclick=async()=>{e.prompt();await e.userChoice;window.__inst=null;ib.hidden=true;};}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
